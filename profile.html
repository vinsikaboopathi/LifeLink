<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        LifeLink Emergency Profile
    </title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <main class="profile-page">


        <div
            class="profile-card"
            id="profileCard"
        >


            <div class="profile-logo">

                <img
                    src="lifelink-logo.png"
                    alt="LifeLink"
                >

            </div>


            <h1>
                LifeLink
            </h1>


            <p class="profile-subtitle">
                Emergency Medical Profile
            </p>


            <div class="emergency-badge">
                🚨 Essential Information
            </div>


            <div class="info">

                <div class="label">
                    Name
                </div>

                <div
                    class="value"
                    id="name"
                >
                    -
                </div>

            </div>


            <div class="info">

                <div class="label">
                    Blood Group
                </div>

                <div
                    class="value blood"
                    id="bloodGroup"
                >
                    -
                </div>

            </div>


            <div class="info">

                <div class="label">
                    Allergies
                </div>

                <div
                    class="value"
                    id="allergy"
                >
                    -
                </div>

            </div>


            <div class="info">

                <div class="label">
                    Medical Condition
                </div>

                <div
                    class="value"
                    id="condition"
                >
                    -
                </div>

            </div>


            <div
                class="id"
                id="lifeLinkId"
            >
                LifeLink ID: -
            </div>


            <div class="footer">

                When the victim cannot speak,
                LifeLink lets their information speak.

            </div>


        </div>


    </main>


    <script>

        function showError() {

            document.getElementById("profileCard").innerHTML = `

                <div class="error">

                    <div class="error-icon">
                        ⚠️
                    </div>

                    <h2>
                        Invalid or missing LifeLink profile.
                    </h2>

                    <p>
                        Please scan a valid LifeLink QR code.
                    </p>

                    <a
                        href="index.html"
                        class="secondary-btn"
                    >
                        Go Home
                    </a>

                </div>

            `;

        }


        try {

            const params =
                new URLSearchParams(
                    window.location.search
                );


            let profile = null;


            /*
                Method 1:
                ?data=
            */

            const data =
                params.get("data");


            if (data) {

                try {

                    profile =
                        JSON.parse(data);

                } catch (error) {

                    console.log(
                        "Data parsing failed."
                    );

                }

            }


            /*
                Method 2:
                ?p=
            */

            if (!profile) {

                const encoded =
                    params.get("p");


                if (encoded) {

                    try {

                        const decoded =
                            decodeURIComponent(
                                atob(encoded)
                            );


                        profile =
                            JSON.parse(
                                decoded
                            );

                    } catch (error) {

                        console.log(
                            "Base64 decoding failed."
                        );

                    }

                }

            }


            /*
                Display Profile
            */

            if (
                !profile ||
                !profile.name
            ) {

                showError();

            } else {


                document.getElementById(
                    "name"
                ).textContent =
                    profile.name;


                document.getElementById(
                    "bloodGroup"
                ).textContent =
                    profile.bloodGroup ||
                    "-";


                document.getElementById(
                    "allergy"
                ).textContent =
                    profile.allergy ||
                    "-";


                document.getElementById(
                    "condition"
                ).textContent =
                    profile.condition ||
                    "-";


                document.getElementById(
                    "lifeLinkId"
                ).textContent =
                    "LifeLink ID: " +
                    (
                        profile.id ||
                        "-"
                    );

            }

        } catch (error) {

            showError();

        }

    </script>

</body>

</html>
