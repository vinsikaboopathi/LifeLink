<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LifeLink Emergency Profile</title>
    <link rel="stylesheet" href="style.css?v=3">
</head>
<body>
<main class="profile-page">
    <div class="profile-card" id="profileCard">
        <div class="profile-logo">
            <img src="lifelink-logo.png" alt="LifeLink">
        </div>
        <h1>LifeLink</h1>
        <p class="profile-subtitle">Emergency Medical Profile</p>

        <div id="profileContent">
            <div class="error-box">Loading emergency information...</div>
        </div>

        <p class="profile-footer-note">
            Only essential emergency medical information is shown. Emergency phone numbers are kept private.
        </p>
    </div>
</main>
<script src="script.js?v=3"></script>
<script>
    document.addEventListener('DOMContentLoaded', loadPublicProfile);
</script>
</body>
</html>
