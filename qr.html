<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        LifeLink QR
    </title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <header class="navbar">

        <a href="index.html" class="nav-logo">

            <img
                src="lifelink-logo.png"
                alt="LifeLink"
            >

        </a>


        <nav class="nav-links">

            <a href="index.html">
                Home
            </a>

            <a href="create-profile.html">
                Profile
            </a>

            <a
                href="qr.html"
                class="active"
            >
                QR
            </a>

            <a href="emergency.html">
                Emergency
            </a>

        </nav>

    </header>


    <main class="page-container">

        <div class="qr-card">

            <img
                src="lifelink-logo.png"
                alt="LifeLink"
                class="small-page-logo"
            >


            <h1>
                Your LifeLink QR
            </h1>


            <p>
                Scan this QR code to access essential
                emergency medical information.
            </p>


            <div id="qrArea">

                <div class="loading">
                    Loading QR...
                </div>

            </div>


            <div
                class="qr-id"
                id="qrId"
            >
            </div>


            <a
                href="create-profile.html"
                class="secondary-btn"
            >
                Update Profile
            </a>

        </div>

    </main>


    <script src="script.js"></script>

</body>

</html>
