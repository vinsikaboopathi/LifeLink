<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create LifeLink Profile</title>
<link rel="stylesheet" href="style.css?v=profile-final-2">
<style>
/* PROFILE PAGE ONLY - does not change Home / QR / Emergency */
html,body{margin:0!important;padding:0!important;min-height:100%!important;background:#f5f8fb!important;font-family:Arial,Helvetica,sans-serif!important;color:#18324d!important}
body.profile-only-page{display:block!important;overflow-x:hidden!important}
body.profile-only-page .navbar{height:76px!important;padding:0 7%!important;display:flex!important;align-items:center!important;justify-content:space-between!important;background:rgba(255,255,255,.98)!important;border-bottom:1px solid #e7edf3!important;position:sticky!important;top:0!important;z-index:10!important}
body.profile-only-page .nav-logo img{width:105px!important;height:auto!important;display:block!important}
body.profile-only-page .nav-links{display:flex!important;align-items:center!important;gap:32px!important}
body.profile-only-page .nav-links a{font-size:15px!important;font-weight:600!important;text-decoration:none!important;color:#4a5568!important}
body.profile-only-page .nav-links a.active{color:#e53935!important}
body.profile-only-page .nav-links a.active::after{content:""!important;display:block!important;height:2px!important;background:#e53935!important;border-radius:5px!important;position:relative!important;bottom:-8px!important}
.profile-only-wrap{min-height:calc(100vh - 77px)!important;padding:55px 20px 70px!important;display:flex!important;justify-content:center!important;align-items:flex-start!important;background:#f5f8fb!important}
.profile-only-card{width:min(820px,100%)!important;background:#fff!important;border:1px solid #dce6ef!important;border-radius:12px!important;padding:38px 42px!important;box-shadow:0 10px 28px rgba(23,55,85,.08)!important}
.profile-only-heading{text-align:center!important;margin:0 0 7px!important;font-size:30px!important;line-height:1.2!important;color:#123b61!important;font-weight:800!important}
.profile-only-sub{text-align:center!important;margin:0 0 28px!important;color:#718096!important;font-size:15px!important}
.profile-only-privacy{border:1px solid #bfe6e4!important;border-left:5px solid #0b9ca5!important;border-radius:8px!important;background:#effafa!important;padding:14px 16px!important;margin-bottom:28px!important;font-size:14px!important;line-height:1.5!important;color:#526b7e!important}
.profile-only-privacy strong{display:block!important;color:#087f8a!important;margin-bottom:3px!important}
#profileForm.profile-only-form{display:grid!important;grid-template-columns:1fr 1fr!important;gap:20px!important;margin:0!important}
.profile-only-field{display:flex!important;flex-direction:column!important;gap:7px!important}
.profile-only-field label{font-size:14px!important;font-weight:800!important;color:#183a5a!important}
.profile-only-field input,.profile-only-field select{width:100%!important;height:50px!important;min-height:50px!important;padding:0 14px!important;border:1px solid #cbd9e5!important;border-radius:8px!important;background:#fff!important;color:#173a5e!important;font-size:15px!important;outline:none!important;box-shadow:none!important}
.profile-only-field input:focus,.profile-only-field select:focus{border-color:#0b91b6!important;box-shadow:0 0 0 3px rgba(11,145,182,.10)!important}
.profile-only-field input::placeholder{color:#9aa9b8!important}
.profile-only-button{grid-column:1 / -1!important;width:100%!important;height:52px!important;margin-top:5px!important;border:0!important;border-radius:8px!important;background:#0b8caf!important;color:#fff!important;font-size:16px!important;font-weight:800!important;cursor:pointer!important;box-shadow:0 7px 16px rgba(11,140,175,.18)!important}
.profile-only-button:hover{background:#087ea0!important}
@media(max-width:700px){.profile-only-wrap{padding:30px 14px 50px!important}.profile-only-card{padding:28px 20px!important}.profile-only-heading{font-size:25px!important}#profileForm.profile-only-form{grid-template-columns:1fr!important}.profile-only-button{grid-column:1!important}.profile-only-nav{gap:16px!important}}
</style>
</head>
<body class="profile-only-page">
<header class="navbar">
  <a href="index.html" class="nav-logo"><img src="lifelink-logo.png" alt="LifeLink"></a>
  <nav class="nav-links">
    <a href="index.html">Home</a>
    <a href="create-profile.html" class="active">Profile</a>
    <a href="qr.html">QR</a>
    <a href="emergency.html">Emergency</a>
  </nav>
</header>

<main class="profile-only-wrap">
  <section class="profile-only-card">
    <h1 class="profile-only-heading">Create LifeLink Profile</h1>
    <p class="profile-only-sub">Add essential medical information for emergency situations.</p>

    <div class="profile-only-privacy">
      <strong>🔒 Privacy Protected</strong>
      Only essential emergency information will be available through the public QR profile. Emergency contact numbers are not displayed publicly.
    </div>

    <form id="profileForm" class="profile-only-form">
      <div class="profile-only-field">
        <label for="name">Full Name</label>
        <input type="text" id="name" placeholder="Enter your full name" autocomplete="name" required>
      </div>

      <div class="profile-only-field">
        <label for="bloodGroup">Blood Group</label>
        <select id="bloodGroup" required>
          <option value="">Select blood group</option>
          <option value="A+">A+</option><option value="A-">A-</option>
          <option value="B+">B+</option><option value="B-">B-</option>
          <option value="AB+">AB+</option><option value="AB-">AB-</option>
          <option value="O+">O+</option><option value="O-">O-</option>
        </select>
      </div>

      <div class="profile-only-field">
        <label for="allergy">Allergies</label>
        <input type="text" id="allergy" placeholder="Example: Penicillin / None">
      </div>

      <div class="profile-only-field">
        <label for="condition">Medical Condition</label>
        <input type="text" id="condition" placeholder="Example: Asthma / None">
      </div>

      <button type="submit" class="profile-only-button">Generate LifeLink QR</button>
    </form>
  </section>
</main>
<script src="script.js?v=profile-final-2"></script>
</body>
</html>
